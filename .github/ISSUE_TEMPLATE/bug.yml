name: Bug report / Ошибка
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: TallyRill version, OS and browser
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal invented CSVs
      description: Include the selected key, encoding and delimiter. Remove names, business data, credentials and private file paths.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Expected and actual results
    validations:
      required: true

