<script type="text/plain" id="worker">"use strict";

class DataError extends Error {
  constructor(code, ...args) {
    super(code);
    this.args = args;
  }
}
function fail(code, ...args) { throw new DataError(code, ...args); }
const limits = {bytes: 12 * 1024 * 1024, cells: 500000, columns: 256};

function decode(buffer, encoding) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length > limits.bytes) fail("fileSize");
  if (encoding === "auto") {
    encoding = bytes[0] === 255 && bytes[1] === 254 ? "utf-16le"
      : bytes[0] === 254 && bytes[1] === 255 ? "utf-16be" : "utf-8";
  }
  let value;
  try { value = new TextDecoder(encoding, {fatal:true}).decode(bytes); }
  catch { fail("encoding"); }
  if (value.includes("\0")) fail("binary");
  return {value, encoding};
}

function delimiter(text) {
  const counts = new Map([[",",0], [";",0], ["\t",0]]);
  let quoted = false;
  for (const c of text) {
    if (c === '"') quoted = !quoted;
    if (quoted) continue;
    if (c === "\n" || c === "\r") break;
    if (counts.has(c)) counts.set(c, counts.get(c) + 1);
  }
  return [...counts].sort((a,b) => b[1]-a[1])[0][0];
}

function parse(input, choice = "auto") {
  const text = input.replace(/^\uFEFF/, "");
  const sep = choice === "auto" ? delimiter(text) : choice;
  const rows = [];
  let headers, fields = [], value = "", quoted = false, closed = false, touched = false, cells = 0;
  function pushField() {
    if (++cells > limits.cells || fields.length >= limits.columns) fail("cellLimit");
    fields.push(value);
    value = "";
    closed = false;
  }
  function endRecord() {
    if (!touched) return;
    pushField();
    if (!headers) {
      if (fields.some(h => !h.trim()) || new Set(fields).size !== fields.length) fail("header");
      headers = fields;
    } else {
      if (fields.length !== headers.length) fail("width", rows.length + 2, fields.length, headers.length);
      rows.push(fields);
    }
    fields = [];
    touched = false;
  }
  for (let i=0; i<text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') value += c;
      else if (text[i+1] === '"') { value += c; i++; }
      else { quoted = false; closed = true; }
    } else if (c === "\r" || c === "\n") {
      endRecord();
      if (c === "\r" && text[i+1] === "\n") i++;
    } else if (c === sep) {
      touched = true;
      pushField();
    } else {
      touched = true;
      if (closed || (c === '"' && value.length)) fail("quote", rows.length + (headers ? 2 : 1));
      if (c === '"') quoted = true;
      else value += c;
    }
  }
  if (quoted) fail("quote", rows.length + (headers ? 2 : 1));
  endRecord();
  if (!headers) fail("empty");
  return {headers, rows, sep};
}

function indexTable(table, keys, side) {
  const cols = keys.map(k => table.headers.indexOf(k));
  const map = new Map();
  for (const [i, row] of table.rows.entries()) {
    const parts = cols.map(c => row[c]);
    if (parts.some(s => !s.trim())) fail("blankKey", side, i+2);
    const key = JSON.stringify(parts);
    if (map.has(key)) fail("dupKey", side, map.get(key)+2, i+2);
    map.set(key, i);
  }
  return map;
}

function compare(a, b, keys) {
  if (!keys.length || keys.some(k => !a.headers.includes(k) || !b.headers.includes(k))) fail("key");
  const left = indexTable(a, keys, "A"), right = indexTable(b, keys, "B");
  const all = [...new Set([...a.headers, ...b.headers])];
  const cols = all.map(h => ({h, x:a.headers.indexOf(h), y:b.headers.indexOf(h)}));
  const common = cols.filter(c => c.x >= 0 && c.y >= 0 && !keys.includes(c.h));
  const schema = cols.filter(c => c.x < 0 || c.y < 0);
  const records = [], counts = {changed:0, added:0, removed:0, same:0};
  const add = (key, status, x, y) => { counts[status]++; records.push({key, status, x, y}); };
  for (const [key, x] of left) {
    const y = right.get(key);
    if (y === undefined) add(key, "removed", x, null);
    else if (common.some(c => a.rows[x][c.x] !== b.rows[y][c.y])) add(key,"changed",x,y);
    else counts.same++;
  }
  for (const [key, y] of right) if (!left.has(key)) add(key, "added", null, y);
  return {records, counts, schema, cols, common, a, b};
}

function* details(diff, row) {
  const changed = row.status === "changed";
  for (const {h,x,y} of changed ? diff.common : diff.cols) {
    const before = row.x === null || x < 0 ? null : diff.a.rows[row.x][x];
    const after = row.y === null || y < 0 ? null : diff.b.rows[row.y][y];
    if (before !== after) yield [h, before, after];
  }
}
function query(diff, status, needle) {
  const s = needle.trim().toLowerCase();
  return diff.records.filter(r => {
    if (status !== "all" && status !== r.status) return false;
    if (!s || JSON.parse(r.key).some(k => k.toLowerCase().includes(s))) return true;
    for (const cells of details(diff,r)) if (cells.some(v => v !== null && v.toLowerCase().includes(s))) return true;
    return false;
  });
}
function csvCell(v) {
  let s = v ?? "";
  if (/^[\s\uFEFF]*[=+\-@\uFF1D\uFF0B\uFF0D\uFF20]/u.test(s) || /^[\t\r\n]/.test(s)) s = "'" + s;
  return '"' + s.replaceAll('"','""') + '"';
}
function exportCSV(diff, keys) {
  let length = 0;
  const chunks = [];
  function append(cells) {
    const line = cells.map(csvCell).join(",") + "\r\n";
    length += line.length;
    if (length > 24 * 1024 * 1024) fail("exportLimit");
    chunks.push(line);
  }
  append(["status", ...keys.map(k=>"key:"+k), "field", "before", "after"]);
  for (const c of diff.schema) append([c.x < 0 ? "column_added" : "column_removed", ...keys.map(()=>""), c.h,"",""]);
  for (const r of diff.records) {
    const parts = JSON.parse(r.key);
    for (const triple of details(diff,r)) append([r.status,...parts,...triple]);
  }
  return new Blob(["\uFEFF", ...chunks],{type:"text/csv;charset=utf-8"});
}
if (typeof module !== "undefined") module.exports = {decode, parse, compare, details, query, exportCSV};

let tables = [], diff, keys, lastFilter, matches;
onmessage = async ({data}) => {
  try {
    if (data.op === "load") {
      diff = null;
      tables = [];
      for (const [i,file] of data.files.entries()) {
        if (!file) { tables.push(null); continue; }
        try {
          if (file.size > limits.bytes) fail("fileSize");
          const {value,encoding} = decode(await file.arrayBuffer(), data.enc[i]);
          const table = parse(value, data.sep[i]);
          table.encoding = encoding;
          tables.push(table);
        } catch(e) { e.side = i ? "B" : "A"; throw e; }
      }
      const meta = tables.map(t => t && ({headers:t.headers, count:t.rows.length, encoding:t.encoding, sep:t.sep}));
      postMessage({op:"loaded", meta});
    } else if (data.op === "compare") {
      diff = null;
      keys = data.keys;
      diff = compare(...tables, keys);
      lastFilter = null;
      postMessage({op:"compared", counts:diff.counts, schema:diff.schema});
    } else if (data.op === "page") {
      const f = JSON.stringify([data.status,data.search]);
      if (lastFilter !== f) { matches = query(diff,data.status,data.search); lastFilter = f; }
      const rows = matches.slice(data.start,data.start + 12).map(r => ({
        key:JSON.parse(r.key), status:r.status, cells:[...details(diff,r)]
      }));
      postMessage({op:"page", seq:data.seq, rows, total:matches.length, start:data.start});
    } else if (data.op === "export") postMessage({op:"export", blob:exportCSV(diff,keys)});
  } catch(e) {
    postMessage({op:"error", action:data.op, code:e instanceof DataError ? e.message : "unexpected", args:e.args || [], side:e.side});
  }
};

U + Depot."],fileSize:["This file exceeds 12 MiB.","Размер файла превышает 12 МиБ."],encoding:["Cannot decode the file. Choose its encoding in Import settings.","Не удалось прочитать текст. Выберите кодировку в настройках чтения."],binary:["Found binary data. Check the encoding or export the sheet as CSV.","Обнаружены двоичные данные. Проверьте кодировку или сохраните лист как CSV."],header:["Each column needs a unique, non-empty header.","У каждого столбца должно быть уникальное непустое название."],cellLimit:["Limit exceeded. Use up to 500,000 cells and 256 columns per file.","Предел на файл — 500 000 ячеек и 256 столбцов."],width:["Record {0} has {1} fields. Expected {2}. Check the delimiter.","В записи {0} полей: {1}. Ожидалось {2}. Проверьте разделитель."],quote:["Invalid quotation marks in record {0}.","Некорректные кавычки в записи {0}."],empty:["This file has no header.","В файле отсутствует заголовок."],key:["Choose at least one shared key column.","Выберите хотя бы один общий столбец ключа."],noCommon:["No shared column names. Check headers and import settings.","Общих названий столбцов нет. Проверьте заголовки и настройки чтения."],dupKey:["{0}: records {1} and {2} share a key. Add a key column or correct the export.","{0}: в записях {1} и {2} совпадает ключ. Добавьте столбец в ключ или исправьте выгрузку."],blankKey:["{0}: record {1} contains an empty key. Check the export or choose other columns.","{0}: в записи {1} пустая часть ключа. Проверьте выгрузку или выберите другие столбцы."],unexpected:["The operation failed. Check the file and try again.","Операция не удалась. Проверьте файл и повторите."],exportLimit:["This report is too large to export at once. Split the sources by key.","Отчёт слишком велик для экспорта. Разделите исходные файлы по ключу."],download:["CSV report prepared for download.","CSV-отчёт подготовлен к скачиванию."],field:["Field","Поле"],old:["Before","Было"],new:["After","Стало"],blank:["(empty)","(пусто)"],absent:["—","—"],noMatch:["No changes match these filters.","По выбранным условиям изменений нет."],identical:["All matched rows have the same values in their shared columns.","В общих столбцах всех сопоставленных строк значения совпадают."],schemaPlus:["Added columns","Добавлены столбцы"],schemaMinus:["Removed columns","Удалены столбцы"],of:["of","из"],preparing:["Preparing CSV…","Подготовка CSV…"],blocked:["Action unavailable","Действие недоступно"]
};
</script><script>"use strict";
const $ = id => document.getElementById(id);
const make = (tag, value, cls) => {
  const el = document.createElement(tag);
  if (value !== undefined) el.textContent = value;
  if (cls) el.className = cls;
  return el;
};
function preference(k, value) {
  try {
    if (value === undefined) return localStorage.getItem("tallyrill-"+k);
    localStorage.setItem("tallyrill-"+k,value);
  } catch { /* Storage is optional in local HTML. */ }
}
let lang = preference("lang") || (navigator.language.startsWith("ru") ? "ru" : "en");
let theme = preference("theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
const t = k => labels[k][lang === "ru" ? 1 : 0];
const files=[null,null], enc=["auto","auto"], sep=["auto","auto"];
let meta=[], keys=[], worker, sample=false, autoRun=false, busy=false, report, page, seq=0, timer;
let message="", args=[], side="", bad=false;
const workerURL=URL.createObjectURL(new Blob([$("worker").textContent],{type:"text/javascript"}));

function notice(code="", values=[], prefix="", error=false) {
  message=code; args=values; side=prefix; bad=error;
  $("notice").dataset.bad=error;
  $("notice").textContent = code ? (prefix ? prefix+" · " : "") + t(code).replace(/\{(\d+)\}/g,(_,i)=>values[i]) : "";
}
function dropReport() {
  clearTimeout(timer);
  report=null; page=null; seq++;
  $("entries").replaceChildren();
  $("result").hidden=true;
  $("search").value="";
  $("filter").value="all";
}
function selectOptions(select, items, current) {
  select.replaceChildren(...items.map(([value,label])=>new Option(label,value,false,value===current)));
}
function drawFile(i) {
  const el=make("div",undefined,"file");
  const top=make("div",undefined,"filetop");
  top.append(make("b","AB"[i],"badge"),make("h3",t(i?"after":"before")));
  const pick=make("label",files[i]?.name || t("pick"),"pick");
  const input=make("input");
  input.type="file"; input.id="file"+i; input.accept=".csv,.tsv,.txt";
  input.setAttribute("aria-label",t(i?"after":"before"));
  const take=file=>{
    if (!file) return;
    files[i]=file; sample=false; autoRun=false; reload();
  };
  input.onchange=()=>take(input.files[0]); pick.append(input);
  el.ondragover=e=>{e.preventDefault();el.classList.add("over");};
  el.ondragleave=()=>el.classList.remove("over");
  el.ondrop=e=>{e.preventDefault();el.classList.remove("over");take(e.dataTransfer.files[0]);};
  const info=meta[i];
  const summary=info ? info.count+" "+t("rows")+" · "+info.headers.length+" "+t("cols")+" · "+info.encoding.toUpperCase() : t("filetype");
  const details=make("details");details.open=Boolean(document.querySelectorAll(".file details")[i]?.open);
  details.append(make("summary",t("settings")));
  const options=make("div",undefined,"opts");
  for (const [name,model,items] of [
    ["enc",enc,[["auto",t("auto")],["utf-8","UTF-8"],["windows-1251","Windows-1251"],["utf-16le","UTF-16 LE"],["utf-16be","UTF-16 BE"]]],
    ["sep",sep,[["auto",t("auto")],[",",t("comma")],[";",t("semi")],["\t",t("tab")]]]
  ]) {
    const label=make("label",t(name)), select=make("select");
    select.id=name+i; selectOptions(select,items,model[i]);
    select.onchange=()=>{model[i]=select.value; autoRun=false;reload();};
    label.append(select);options.append(label);
  }
  details.append(options);el.append(top,pick,make("p",summary,"meta"),details);
  return el;
}
function common() {return meta[0] && meta[1] ? meta[0].headers.filter(h=>meta[1].headers.includes(h)) : [];}
function updateRun() {
  $("run").disabled=busy || !keys.length || !common().length;
  $("hint").textContent=t(meta.every(Boolean) && meta.length===2 ? (common().length ? "keyReady":"noCommon") : "chooseBoth");
}
function drawInputs() {
  $("inputs").replaceChildren(drawFile(0),drawFile(1));
  $("reset").hidden=!files.some(Boolean);
  const cols=common();
  $("keybox").hidden=!cols.length;
  $("keys").replaceChildren(...cols.map(c=>{
    const label=make("label");const input=make("input");input.type="checkbox";input.value=c;input.checked=keys.includes(c);
    input.onchange=()=>{
      sample=false; dropReport(); keys=cols.filter(h=>[...$("keys").querySelectorAll(":checked")].some(box=>box.value===h));
      notice();updateRun();
    };
    input.disabled=busy;
    label.append(input,document.createTextNode(c));return label;
  }));
  updateRun();
}
function drawReport() {
  if (!report) return;
  $("result").hidden=false;
  $("stats").replaceChildren(...["changed","added","removed","same"].map(k=>{
    const stat=make("div",undefined,"stat");stat.append(make("b",report.counts[k]),make("span",t(k)));return stat;
  }));
  const schema=report.schema;
  $("schema").hidden=!schema.length;
  $("schema").textContent=[["schemaPlus",schema.filter(c=>c.x<0)],["schemaMinus",schema.filter(c=>c.y<0)]]
    .filter(([,v])=>v.length).map(([k,v])=>t(k)+" · "+v.map(c=>c.h).join(", ")).join("\n");
  if (!page) return;
  const entries=page.rows.map(row=>{
    const article=make("article",undefined,"entry"),head=make("h3");
    head.append(make("span",row.key.join(" / ")),make("span",t(row.status),"tag "+row.status));
    const table=make("table"), tr=table.createTHead().insertRow();
    for(const k of ["field","old","new"]) tr.append(make("th",t(k)));
    const body=table.createTBody();
    for(const cells of row.cells){
      const line=body.insertRow();
      for(const v of cells) line.insertCell().textContent=v===null?t("absent"):v===""?t("blank"):v;
    }
    article.append(head,table);return article;
  });
  if (!entries.length) entries.push(make("p",t(Object.keys(report.counts).filter(k=>k!=="same").every(k=>!report.counts[k])?"identical":"noMatch"),"entry"));
  $("entries").replaceChildren(...entries);
  $("prev").disabled=page.start===0; $("next").disabled=page.start+12>=page.total;
  $("pageinfo").textContent=page.total ? (page.start+1)+"–"+Math.min(page.total,page.start+12)+" "+t("of")+" "+page.total : "0";
}
function localize() {
  document.documentElement.lang=lang;
  document.title="TallyRill · "+t("heading");
  document.documentElement.dataset.theme=theme;
  $("lang").textContent=lang==="ru"?"English":"Русский";
  $("theme").textContent=t(theme==="dark"?"light":"dark");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  selectOptions($("filter"),["all","changed","added","removed"].map(k=>[k,t(k)]),$("filter").value || "all");
  drawInputs();drawReport();notice(message,args,side,bad);
}
function pageAt(start=0) {
  if (report) worker.postMessage({op:"page", seq:++seq, start, status:$("filter").value, search:$("search").value});
}
function run() {
  if ($("run").disabled) return;
  dropReport();busy=true;drawInputs();notice("working");
  worker.postMessage({op:"compare", keys});
}
function reload() {
  worker?.terminate();busy=files.some(Boolean);dropReport();meta=[];drawInputs();
  notice(busy?"loading":"");
  if (!busy) return;
  worker=new Worker(workerURL);
  worker.onerror=()=>{busy=false;drawInputs(); notice("unexpected",[],"",true);};
  worker.onmessage=({data:d})=>{
    if(d.op==="loaded"){
      meta=d.meta;const cols=common();
      keys=keys.filter(k=>cols.includes(k));
      if(!keys.length && cols.length) keys=[cols[0]];
      busy=false;notice();drawInputs();
      if(autoRun){autoRun=false;run();}
    } else if (d.op==="compared"){
      busy=false;report=d;page=null;drawInputs();drawReport();pageAt();notice(sample?"sampleDone":"finished");
      $("result").scrollIntoView({block:"start"});
    } else if(d.op==="page" && d.seq===seq && report){page=d;drawReport();}
    else if(d.op==="export"){
      $("export").disabled=false;
      const url=URL.createObjectURL(d.blob),a=make("a");a.href=url;a.download="TallyRill-changes.csv";a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);notice("download");
    } else if(d.op==="error"){
      busy=false;autoRun=false;$("export").disabled=false;drawInputs();notice(d.code,d.args,d.side,true);
    }
  };
  $("export").disabled=false;
  worker.postMessage({op:"load",files,enc,sep});
}
$("run").onclick=run;
$("reset").onclick=()=>{files.fill(null);enc.fill("auto");sep.fill("auto");keys=[];sample=false;autoRun=false;reload();};
$("sample").onclick=()=>{
  for(const [i,csv] of samples.entries()) files[i]=new File([csv],i?"catalog-after.csv":"catalog-before.csv",{type:"text/csv"});
  enc.fill("auto");sep.fill("auto");keys=["SKU","Depot"];sample=true;autoRun=true;reload();
};
$("filter").onchange=()=>pageAt();
$("search").oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>pageAt(),120);};
$("prev").onclick=()=>pageAt(Math.max(0,page.start-12));
$("next").onclick=()=>pageAt(page.start+12);
$("export").onclick=()=>{$("export").disabled=true;notice("preparing");worker.postMessage({op:"export"});};
$("lang").onclick=()=>{lang=lang==="ru"?"en":"ru";preference("lang",lang);localize();};
$("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";preference("theme",theme);localize();};
localize();
</script></body></html>
